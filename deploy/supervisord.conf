[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/crm-supervisord.pid

[program:web]
user=crm
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
directory=/app/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:accounting]
user=crm
command=python -m app.accounting_worker
directory=/app/backend
autostart=true
autorestart=unexpected
exitcodes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
