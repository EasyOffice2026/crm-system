# One demonstration workspace on Fly's HTTPS hostname. Not a production SaaS configuration.
app = "nexera-crm-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  CRM_ENV = "staging"
  CRM_TENANCY = "hosted"
  CRM_BASE_DOMAIN = "fly.dev"
  CRM_WORKSPACE_SCHEME = "https"
  CRM_UPLOAD_DIR = "/data/uploads"
  CRM_ACCOUNTING_WORKER_ENABLED = "true"
  CRM_PROVIDER_WORKER_ENABLED = "false"

[deploy]
  release_command = "python -m app.migrate --control"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "crm_uploads"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
