[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "starlette==1.3.1", "uvicorn==0.35.0", "sqlalchemy==2.0.43",
  "pydantic==2.11.7", "reportlab==4.4.3", "psycopg[binary]==3.2.9", "python-multipart==0.0.32", "httpx==0.28.1",
  "alembic==1.16.5", "cryptography==45.0.7"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.12.11", "mypy==1.17.1", "types-reportlab==4.4.1.20250822"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
